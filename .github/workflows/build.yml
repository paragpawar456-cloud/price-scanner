name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch fonts (Plus Jakarta Sans, Inter; SIL Open Font License)
        run: |
          set -e
          mkdir -p app/src/main/res/font
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o app/src/main/res/font/plus_jakarta_sans.ttf "$base/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf"
          curl -fsSL -o app/src/main/res/font/inter.ttf "$base/inter/Inter%5Bopsz,wght%5D.ttf" \
            || curl -fsSL -o app/src/main/res/font/inter.ttf "$base/inter/Inter%5Bslnt,wght%5D.ttf"
          ls -la app/src/main/res/font

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PriceScan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PriceScan-apk
          path: PriceScan.apk

      - name: Publish as latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PriceScan (latest build)
          body: Latest APK built from main. Download PriceScan.apk below and install it on your phone.
          prerelease: false
          make_latest: true
          files: PriceScan.apk
